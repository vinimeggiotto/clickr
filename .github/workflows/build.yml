name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Clickr-windows
            upload_path: dist/Clickr.exe
          - os: macos-latest
            artifact: Clickr-macos
            upload_path: dist/Clickr.app.zip
          - os: ubuntu-latest
            artifact: Clickr-linux
            upload_path: dist/Clickr

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI deps (pywebview / GTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            gir1.2-gtk-3.0 \
            x11-utils \
            xdotool

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build_exe.ps1

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          chmod +x ./build_macos.sh
          ./build_macos.sh

      - name: Pack macOS app as zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r Clickr.app.zip Clickr.app

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x ./build_linux.sh
          ./build_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          if [ -f artifacts/Clickr-windows/Clickr.exe ]; then
            cp artifacts/Clickr-windows/Clickr.exe release/Clickr.exe
          fi
          if [ -f artifacts/Clickr-macos/Clickr.app.zip ]; then
            cp artifacts/Clickr-macos/Clickr.app.zip release/Clickr.app.zip
          fi
          if [ -f artifacts/Clickr-linux/Clickr ]; then
            cp artifacts/Clickr-linux/Clickr release/Clickr
            chmod +x release/Clickr
          fi
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
