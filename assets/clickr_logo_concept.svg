<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#221a12"/>
      <stop offset="60%" stop-color="#14100c"/>
    </radialGradient>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2c2318"/>
      <stop offset="100%" stop-color="#17120c"/>
    </radialGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- reusable mark: ripple rings + cursor, local box roughly (-28,-33) to (68,85) -->
    <g id="mark">
      <circle cx="20" cy="15" r="48" fill="none" stroke="#f2a33b" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="46 400"
              transform="rotate(-40 20 15)" opacity="0.16"/>
      <circle cx="20" cy="15" r="34" fill="none" stroke="#f2a33b" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="38 300"
              transform="rotate(-40 20 15)" opacity="0.30"/>
      <path d="M20 15 L20 78 L36 63 L47 85 L58 79 L47 57 L68 57 Z" fill="#f2a33b"/>
    </g>
  </defs>

  <rect x="0" y="0" width="900" height="320" rx="24" fill="url(#bgGrad)"/>

  <text x="50" y="36" font-family="ui-monospace, 'Cascadia Code','JetBrains Mono', Consolas, monospace"
        font-size="12" letter-spacing="3" fill="#8f8478">CLICKR &#8212; SISTEMA DE MARCA</text>

  <!-- icon / app badge -->
  <rect x="50" y="60" width="200" height="200" rx="44" fill="url(#badgeGrad)"
        stroke="rgba(255,255,255,0.06)" stroke-width="1" filter="url(#cardShadow)"/>
  <use href="#mark" transform="translate(124,126) scale(1.3)"/>
  <text x="150" y="292" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code','JetBrains Mono', Consolas, monospace"
        font-size="11" letter-spacing="2" fill="#8f8478">ÍCONE / APP ICON</text>

  <!-- horizontal lockup -->
  <use href="#mark" transform="translate(554,141) scale(0.55)"/>
  <text x="634" y="170" font-family="ui-monospace, 'Cascadia Code','JetBrains Mono', Consolas, monospace"
        font-weight="700" font-size="44" letter-spacing="6" fill="#ece5d8">CLICKR</text>
  <text x="634" y="196" font-family="ui-monospace, 'Cascadia Code','JetBrains Mono', Consolas, monospace"
        font-size="12" letter-spacing="3" fill="#8f8478">PULSE CONTROL</text>
  <text x="520" y="292" font-family="ui-monospace, 'Cascadia Code','JetBrains Mono', Consolas, monospace"
        font-size="11" letter-spacing="2" fill="#8f8478">LOGOTIPO HORIZONTAL</text>
</svg>
