<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickr — capturar ponto</title>
  <style>
    :root {
      --amber: #f2a33b;
      --text: #ece5d8;
      --dim: #8f8478;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      background: rgba(10, 8, 6, 0.45);
      font-family: "Segoe UI", "Cascadia Mono", ui-sans-serif, sans-serif;
      color: var(--text);
      user-select: none;
    }
    .banner {
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #241c15, #1d1712);
      border: 1px solid rgba(242, 163, 59, 0.35);
      border-radius: 14px;
      padding: 18px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }
    .banner h1 {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }
    .banner p {
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.5px;
    }
    .banner kbd {
      font-family: ui-monospace, monospace;
      color: var(--text);
      background: #14100c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 1px 6px;
    }
    .cross {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to right, transparent calc(50% - 0.5px), rgba(242, 163, 59, 0.25) calc(50% - 0.5px), rgba(242, 163, 59, 0.25) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
        linear-gradient(to bottom, transparent calc(50% - 0.5px), rgba(242, 163, 59, 0.25) calc(50% - 0.5px), rgba(242, 163, 59, 0.25) calc(50% + 0.5px), transparent calc(50% + 0.5px));
    }
  </style>
</head>
<body>
  <div class="cross" aria-hidden="true"></div>
  <div class="banner">
    <h1 id="ovTitle">Capturar ponto</h1>
    <p id="ovHint">Clique para marcar XY · <kbd>Esc</kbd> cancela</p>
  </div>
  <script>
    async function waitApi(timeoutMs) {
      const start = Date.now();
      while (!(window.pywebview && window.pywebview.api)) {
        if (Date.now() - start > timeoutMs) throw new Error("Bridge indisponível");
        await new Promise((r) => setTimeout(r, 40));
      }
      return window.pywebview.api;
    }

    function getByPath(obj, key) {
      const parts = String(key).split(".");
      let cur = obj;
      for (let i = 0; i < parts.length; i++) {
        if (cur == null || typeof cur !== "object") return undefined;
        cur = cur[parts[i]];
      }
      return cur;
    }

    async function loadOverlayLocale(api) {
      let code = "pt-BR";
      try {
        const settings = await api.get_settings();
        if (settings && settings.locale) code = settings.locale;
      } catch (_) {
        /* keep default */
      }
      let catalog = {};
      let fallback = {};
      try {
        const resFb = await fetch("locales/pt-BR.json", { cache: "no-store" });
        if (resFb.ok) fallback = await resFb.json();
      } catch (_) {
        /* ignore */
      }
      catalog = fallback;
      if (code !== "pt-BR") {
        try {
          const res = await fetch(`locales/${code}.json`, { cache: "no-store" });
          if (res.ok) catalog = await res.json();
        } catch (_) {
          /* fallback */
        }
      }
      const t = (key) => {
        let val = getByPath(catalog, key);
        if (val === undefined) val = getByPath(fallback, key);
        return typeof val === "string" ? val : key;
      };
      document.documentElement.lang = code;
      document.title = t("overlay.windowTitle");
      document.getElementById("ovTitle").textContent = t("overlay.title");
      document.getElementById("ovHint").innerHTML = t("overlay.hint").replace(
        /\bEsc\b/g,
        "<kbd>Esc</kbd>"
      );
    }

    let locked = false;

    async function confirm() {
      if (locked) return;
      locked = true;
      try {
        const api = await waitApi(4000);
        await api.confirm_pick();
      } catch (err) {
        locked = false;
        console.error(err);
      }
    }

    async function cancel() {
      if (locked) return;
      locked = true;
      try {
        const api = await waitApi(4000);
        await api.cancel_pick();
      } catch (err) {
        locked = false;
        console.error(err);
      }
    }

    document.addEventListener("mousedown", (e) => {
      e.preventDefault();
      confirm();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        e.preventDefault();
        cancel();
      }
    });

    (async () => {
      try {
        const api = await waitApi(4000);
        await loadOverlayLocale(api);
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
